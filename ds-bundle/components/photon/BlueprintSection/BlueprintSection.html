<!-- @dsCard group="Layout" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../../styles.css">
  <style>
    body { padding: 0; margin: 0; }
    .demo { padding: 40px 32px; }
    h2 { font-size: var(--text-h2-size); line-height: var(--text-h2-lh); color: var(--text-on-inverse); margin: 8px 0 16px; }
    p  { font-size: var(--text-body-size); color: var(--text-on-inverse-muted); max-width: 560px; }
  </style>
</head>
<body>
  <section class="nb-blueprint demo">
    <span class="nb-eyebrow nb-eyebrow--on-inverse">Cloud Architecture</span>
    <h2>Engineering-Grade AWS Solutions for APAC Enterprise</h2>
    <p>Photon delivers production-ready cloud infrastructure, .NET modernisation, and platform engineering — with a principal-led delivery model.</p>
    <div style="display:flex;gap:12px;margin-top:24px;">
      <button class="nb-btn nb-btn--accent">Book a Discovery Call</button>
      <button class="nb-btn nb-btn--secondary" style="border-color:var(--border-inverse);color:var(--text-on-inverse);background:rgba(255,255,255,0.06);">View Case Studies</button>
    </div>
  </section>
  <section class="nb-blueprint--light demo" style="margin-top:2px;">
    <span class="nb-eyebrow">Light Blueprint</span>
    <p style="color:var(--text-body);margin-top:8px;">Light-mode grid for subtle structural sections on a page interior.</p>
  </section>
</body>
</html>
